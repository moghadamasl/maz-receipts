<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ثبت رسیدهای پرداختی ماز تهران و ری</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffcf7;
      --subtle: #ebe6db;
      --fg: #1c1915;
      --muted: #6b6458;
      --primary: #1e3a4c;
      --primary-fg: #f7f4ee;
      --border: #d8d0c2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      font-family: Vazirmatn, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px -28px rgba(28,25,21,.35);
    }
    .icon {
      width: 48px; height: 48px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
    }
    .kicker { text-align: center; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    h1 { text-align: center; font-size: 22px; font-weight: 600; line-height: 1.4; }
    .sub { text-align: center; margin: 8px 0 28px; font-size: 14px; color: var(--muted); }
    nav { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: flex; align-items: center; gap: 12px;
      min-height: 64px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform .15s ease, background .15s ease;
    }
    a.btn:hover { background: var(--subtle); transform: translateY(-1px); }
    .btn-ico {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      background: var(--subtle);
      color: var(--primary);
    }
    .btn-text { display: flex; flex-direction: column; align-items: flex-start; }
    .btn-text strong { font-size: 16px; font-weight: 600; }
    .btn-text span { font-size: 13px; color: var(--muted); font-weight: 400; }
    svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
    </div>
    <p class="kicker">ماز تهران و ری</p>
    <h1>ثبت رسیدهای پرداختی</h1>
    <p class="sub">یکی از گزینه‌های زیر را انتخاب کنید</p>
    <nav aria-label="فرم‌های ثبت">
      <a class="btn" href="https://survey.porsline.ir/s/BgoTgFsn" target="_blank" rel="noopener">
        <span class="btn-ico"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg></span>
        <span class="btn-text"><strong>ثبت فروش نقدی</strong><span>رسید پرداخت نقدی</span></span>
      </a>
      <a class="btn" href="https://survey.porsline.ir/s/mcekZr2r" target="_blank" rel="noopener">
        <span class="btn-ico"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
        <span class="btn-text"><strong>ثبت فروش اقساطی</strong><span>رسید فروش اقساط</span></span>
      </a>
      <a class="btn" href="https://survey.porsline.ir/s/orouvdMR" target="_blank" rel="noopener">
        <span class="btn-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <span class="btn-text"><strong>ثبت پیش ثبت نام</strong><span>پیش‌ثبت‌نام مشتری</span></span>
      </a>
      <a class="btn" href="https://survey.porsline.ir/s/zT2DcIGy" target="_blank" rel="noopener">
        <span class="btn-ico"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2.3"/><path d="M3 5v14a2 2 0 0 0 2 2h15"/></svg></span>
        <span class="btn-text"><strong>ثبت واریز اقساط</strong><span>واریز قسط دوره</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
